# Every Sunday at 5:00 PM IST (11:30 UTC). Uses the saved daily scan, no Yahoo fetch.
name: Weekly shortlist

on:
  schedule:
    - cron: "30 11 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-shortlist
  cancel-in-progress: false

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      WEEKLY_SHORTLIST_SIZE: "20"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install yfinance pandas numpy requests

      - name: Build the weekly shortlist
        run: python weekly_shortlist.py

      - name: Save the shortlist history to the repository
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data/weekly/weekly_shortlist.json
          if git diff --cached --quiet; then
            echo "No shortlist changes to commit."
          else
            git commit -m "Weekly shortlist $(date -u +%F)"
            git push
          fi
